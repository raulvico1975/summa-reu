# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 3

env:
  # Firebase public config (required for build)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAi_dEPmqHpbEdZH04pCnRRS85AlJ9Pe5g
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: summa-social.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: summa-social
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: summa-social.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "469685881071"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:469685881071:web:97483f2003df7c2407731a
  # Analytics pública: la càrrega de l'etiqueta continua condicionada al
  # consentiment explícit de la persona visitant.
  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: G-C5NJMM8S5P

  # Secrets (reference from Cloud Secret Manager)
  - variable: GOOGLE_API_KEY
    secret: GOOGLE_API_KEY
  - variable: RESEND_API_KEY
    secret: RESEND_API_KEY
  - variable: CONTACT_FORM_TO_EMAIL
    secret: CONTACT_FORM_TO_EMAIL
  - variable: BLOG_ORG_ID
    secret: BLOG_ORG_ID
  - variable: BLOG_PUBLISH_SECRET
    secret: BLOG_PUBLISH_SECRET
  - variable: PRODUCT_UPDATES_PUBLISH_SECRET
    secret: PRODUCT_UPDATES_PUBLISH_SECRET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY

  # Pilot MCP públic: frontera tancada a un únic usuari i entitat, només lectura.
  # Els identificadors no són secrets; el secret Stytch només existeix a Secret Manager.
